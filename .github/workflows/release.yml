name: Release Obsidian plugin

on:
  push:
    tags:
      # Release versions (2.6.6) and prereleases (2.6.6-test.1, 2.7.0-rc.1).
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_BRANCH: main

jobs:
  gates:
    name: Required cross-platform gates
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  draft-verify-publish:
    name: Draft, verify, and publish release
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Verify annotated tag and release branch head
        shell: bash
        run: |
          git fetch --no-tags origin \
            "refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"

          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          tag_type="$(git cat-file -t "${tag_ref}")"
          if [[ "${tag_type}" != 'tag' ]]; then
            echo "${tag_ref} is not an annotated tag (object type: ${tag_type})." >&2
            exit 1
          fi

          tagged_sha="$(git rev-parse "${tag_ref}^{commit}")"
          branch_sha="$(git rev-parse "refs/remotes/origin/${RELEASE_BRANCH}^{commit}")"
          if [[ "${tagged_sha}" != "${branch_sha}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} points to ${tagged_sha}, but ${RELEASE_BRANCH} points to ${branch_sha}." >&2
            exit 1
          fi

      - name: Verify release version parity
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'

          const readJson = (path) => JSON.parse(readFileSync(path, 'utf8'))
          const tag = process.env.TAG
          const packageJson = readJson('package.json')
          const packageLock = readJson('package-lock.json')
          const manifest = readJson('manifest.json')
          const versions = readJson('versions.json')

          const checks = [
            ['package.json', packageJson.version],
            ['package-lock.json', packageLock.version],
            ['package-lock.json root package', packageLock.packages?.['']?.version],
            ['manifest.json', manifest.version],
          ]
          const mismatches = checks.filter(([, version]) => version !== tag)
          for (const [source, version] of mismatches) {
            console.error(`${source} has ${String(version)}; expected ${tag}.`)
          }
          if (mismatches.length > 0) process.exit(1)

          if (versions[tag] !== manifest.minAppVersion) {
            console.error(
              `versions.json has ${String(versions[tag])}; expected ${manifest.minAppVersion} for ${tag}.`,
            )
            process.exit(1)
          }
          NODE

      - name: Resolve release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          # Hand-written notes are preferred, but a missing file must never kill
          # a release: fall back to GitHub's auto-generated notes for the tag.
          notes_file="RELEASE_NOTES_${TAG}.md"
          if [[ -f "${notes_file}" && -s "${notes_file}" ]]; then
            echo "Using hand-written ${notes_file}."
          else
            tagged_sha="$(git rev-parse "refs/tags/${TAG}^{commit}")"
            notes_file="${RUNNER_TEMP}/release-notes-${TAG}.md"
            if ! gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${TAG}" \
              -f target_commitish="${tagged_sha}" \
              --jq '.body' > "${notes_file}"; then
              : > "${notes_file}"
            fi
            if [[ ! -s "${notes_file}" ]]; then
              printf '# %s\n\nNo release notes were provided for this tag.\n' \
                "${TAG}" > "${notes_file}"
            fi
            echo "No RELEASE_NOTES_${TAG}.md found; using auto-generated notes."
          fi
          printf 'RELEASE_NOTES=%s\n' "${notes_file}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: npm ci

      - name: Build release assets
        run: npm run build

      - name: Verify exact release asset set
        shell: bash
        run: |
          expected=(main.js manifest.json styles.css)
          for asset in "${expected[@]}"; do
            if [[ ! -f "${asset}" || ! -s "${asset}" ]]; then
              echo "Release asset ${asset} is missing or empty." >&2
              exit 1
            fi
          done

      - name: Create draft, verify downloaded assets, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          title="Smart_composer_Achmage v${TAG}"
          assets=(main.js manifest.json styles.css)
          # 2.6.6 -> full release; 2.6.6-test.1 / 2.7.0-rc.1 -> prerelease.
          if [[ "${TAG}" == *-* ]]; then
            is_prerelease=true
            publish_flags=(--prerelease=true --latest=false)
          else
            is_prerelease=false
            publish_flags=(--prerelease=false --latest)
          fi
          tagged_sha="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          download_dir="$(mktemp -d)"
          release_notes_with_evidence="$(mktemp)"
          trap 'rm -rf "${download_dir}"; rm -f "${release_notes_with_evidence}"' EXIT

          cp "${RELEASE_NOTES}" "${release_notes_with_evidence}"
          {
            printf '\n## Verified release provenance\n\n'
            printf -- '- Release workflow: %s/%s/actions/runs/%s\n' \
              "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
            printf -- '- CI gate: the full cross-platform CI workflow ran to success on this exact commit inside the release run above.\n'
            printf -- '- Annotated tag commit: `%s`\n' "${tagged_sha}"
            for asset in "${assets[@]}"; do
              printf -- '- `%s`: %s bytes, SHA-256 `%s`\n' \
                "${asset}" "$(wc -c < "${asset}" | tr -d ' ')" \
                "$(sha256sum "${asset}" | cut -d ' ' -f 1)"
            done
            printf -- '- Qualification boundary: no OAuth secret, browser callback, or Keychain state was used in Actions.\n'
          } >> "${release_notes_with_evidence}"

          if release_json="$(gh release view "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json isDraft,assets,targetCommitish 2>/dev/null)"; then
            if [[ "$(jq -r '.isDraft' <<< "${release_json}")" != 'true' ]]; then
              echo "Release ${TAG} is already public; refusing to modify it." >&2
              exit 1
            fi
            unexpected="$(jq -r '.assets[].name' <<< "${release_json}" \
              | grep -Ev '^(main\.js|manifest\.json|styles\.css)$' || true)"
            if [[ -n "${unexpected}" ]]; then
              echo "Draft release contains unexpected assets:" >&2
              echo "${unexpected}" >&2
              exit 1
            fi
            gh release edit "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --draft \
              --latest=false \
              --prerelease="${is_prerelease}" \
              --target "${tagged_sha}" \
              --title "${title}" \
              --notes-file "${release_notes_with_evidence}"
            gh release upload "${TAG}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${TAG}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --draft \
              --latest=false \
              --prerelease="${is_prerelease}" \
              --target "${tagged_sha}" \
              --title "${title}" \
              --notes-file "${release_notes_with_evidence}"
          fi

          release_json="$(gh release view "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json isDraft,assets,targetCommitish)"
          jq -e --arg sha "${tagged_sha}" \
            '.isDraft == true and .targetCommitish == $sha and ([.assets[].name] | sort) == ["main.js", "manifest.json", "styles.css"]' \
            <<< "${release_json}" > /dev/null

          gh release download "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${download_dir}" \
            --pattern 'main.js' \
            --pattern 'manifest.json' \
            --pattern 'styles.css'

          for asset in "${assets[@]}"; do
            cmp --silent "${asset}" "${download_dir}/${asset}"
            printf '%s  %s\n' "$(sha256sum "${asset}" | cut -d ' ' -f 1)" "${asset}"
          done

          # The qualification jobs can run for a long time. Re-read the
          # release branch immediately before publication so a concurrent
          # branch push cannot silently invalidate the tag/head invariant.
          git fetch --no-tags origin \
            "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
          current_branch_sha="$(git rev-parse "refs/remotes/origin/${RELEASE_BRANCH}^{commit}")"
          if [[ "${current_branch_sha}" != "${tagged_sha}" ]]; then
            echo "Release branch moved to ${current_branch_sha} after qualification; keeping ${TAG} as a draft." >&2
            exit 1
          fi

          gh release edit "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft=false \
            "${publish_flags[@]}" \
            --target "${tagged_sha}" \
            --title "${title}" \
            --notes-file "${release_notes_with_evidence}"

          gh release view "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json isDraft,isPrerelease,assets,targetCommitish,url \
            --jq '{url, isDraft, isPrerelease, targetCommitish, assets: [.assets[] | {name, size, digest}]}'
