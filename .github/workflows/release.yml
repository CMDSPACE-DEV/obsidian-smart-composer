name: Release Obsidian plugin

on:
  push:
    tags:
      - '2.6.1'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_BRANCH: codex/2.6.1-plan-runtime-hotfix
  RELEASE_NOTES: RELEASE_NOTES_2.6.1.md

jobs:
  verify-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Verify tag points to the release branch head
        shell: bash
        run: |
          git fetch --no-tags origin \
            "refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"

          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          tag_type="$(git cat-file -t "${tag_ref}")"
          if [[ "${tag_type}" != "tag" ]]; then
            echo "${tag_ref} is not an annotated tag (object type: ${tag_type})." >&2
            exit 1
          fi

          tagged_sha="$(git rev-parse "${tag_ref}^{commit}")"
          branch_sha="$(git rev-parse "refs/remotes/origin/${RELEASE_BRANCH}^{commit}")"

          if [[ "${tagged_sha}" != "${branch_sha}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} points to ${tagged_sha}, but ${RELEASE_BRANCH} points to ${branch_sha}." >&2
            exit 1
          fi

      - name: Verify release version parity
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'

          const readJson = (path) => JSON.parse(readFileSync(path, 'utf8'))
          const tag = process.env.TAG
          const packageJson = readJson('package.json')
          const packageLock = readJson('package-lock.json')
          const manifest = readJson('manifest.json')
          const versions = readJson('versions.json')

          const checks = [
            ['package.json', packageJson.version],
            ['package-lock.json', packageLock.version],
            ['package-lock.json root package', packageLock.packages?.['']?.version],
            ['manifest.json', manifest.version],
          ]

          const mismatches = checks.filter(([, version]) => version !== tag)
          if (mismatches.length > 0) {
            for (const [source, version] of mismatches) {
              console.error(`${source} has ${String(version)}; expected ${tag}.`)
            }
            process.exit(1)
          }

          if (versions[tag] !== manifest.minAppVersion) {
            console.error(
              `versions.json has ${String(versions[tag])}; expected ${manifest.minAppVersion} for ${tag}.`,
            )
            process.exit(1)
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type:check

      - name: Lint check
        run: npm run lint:check

      - name: Test
        run: npm test -- --runInBand

      - name: Build plugin
        run: npm run build

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          title="Smart_composer_Achmage v${TAG}"
          assets=(main.js manifest.json styles.css)

          if is_draft="$(gh release view "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json isDraft \
            --jq '.isDraft' 2>/dev/null)"; then
            gh release upload "${TAG}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
            gh release edit "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft=false \
              --title "${title}" \
              --notes-file "${RELEASE_NOTES}"
          else
            gh release create "${TAG}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${title}" \
              --notes-file "${RELEASE_NOTES}"
          fi
